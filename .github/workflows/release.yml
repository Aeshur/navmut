name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ format('Release ({0})', matrix.platform) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: ubuntu
            os: ubuntu-latest
          - platform: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: i686-pc-windows-msvc
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install Node dependencies
        run: npm ci
      - name: Build Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/package-windows.ps1
      - name: Build Ubuntu packages
        if: runner.os == 'Linux'
        run: npm run tauri -- build --bundles appimage,deb
      - name: Build macOS package
        if: runner.os == 'macOS'
        run: npm run tauri -- build --bundles dmg
      - name: Upload Windows ZIP
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Navmut-windows
          path: out/Navmut-windows.zip
          if-no-files-found: error
      - name: Upload Ubuntu packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Navmut-ubuntu
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: error
      - name: Upload macOS package
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Navmut-macos
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --verify-tag \
              --title "Navmut $TAG_NAME" \
              --generate-notes
          fi
          find release-assets -type f -print0 |
            while IFS= read -r -d '' asset; do
              gh release upload "$TAG_NAME" "$asset" --clobber
            done
